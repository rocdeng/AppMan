<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppMan Recipe</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #697386;
      --line: #dfe4ec;
      --panel: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --soft: #f5f7fb;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background: #f3f5f9;
    }
    main { width: min(680px, 100%); }
    header { margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.04em; }
    header p { margin: 0; color: var(--muted); line-height: 1.6; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 16px 50px rgb(20 31 54 / 8%);
    }
    form { display: grid; gap: 17px; }
    label { display: grid; gap: 7px; font-size: 14px; font-weight: 650; }
    label span { color: var(--muted); font-size: 12px; font-weight: 500; }
    input {
      width: 100%;
      border: 1px solid #cbd2dd;
      border-radius: 10px;
      padding: 12px 13px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(37 99 235 / 12%); }
    button, .download {
      border: 0;
      border-radius: 10px;
      padding: 12px 17px;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button { color: #fff; background: var(--accent); }
    button:hover { background: var(--accent-hover); }
    button:disabled { cursor: wait; opacity: .65; }
    #status { min-height: 22px; margin: 16px 2px 0; color: var(--muted); line-height: 1.55; }
    #status.error { color: #b42318; }
    #result {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft);
    }
    #result.visible { display: grid; gap: 14px; }
    .result-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .result-head h2 { margin: 0 0 5px; font-size: 20px; }
    .result-head p { margin: 0; color: var(--muted); font-size: 13px; }
    .badge { padding: 5px 9px; border-radius: 999px; background: #e5edff; color: #1d4ed8; font-size: 12px; white-space: nowrap; }
    pre { margin: 0; max-height: 270px; overflow: auto; padding: 14px; border-radius: 9px; background: #111827; color: #e5e7eb; font-size: 12px; line-height: 1.55; }
    .download { display: inline-block; color: #fff; background: #172033; }
    @media (max-width: 520px) { .card { padding: 19px; } .result-head { display: grid; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AppMan Recipe</h1>
      <p>通过 SQLite 索引查询 Recipe 文件；未命中时，使用 AppMan 的内部流程生成并保存，然后提供 JSON 下载。</p>
    </header>
    <section class="card">
      <form id="recipe-form">
        <label>App 名称
          <input id="appName" name="appName" required maxlength="120" placeholder="例如：IINA" autocomplete="off">
        </label>
        <label>Bundle ID <span>可选</span>
          <input id="bundleId" name="bundleId" maxlength="255" placeholder="例如：com.colliderli.iina" autocomplete="off">
        </label>
        <label>官网 <span>可选，请填写完整网址</span>
          <input id="website" name="website" type="url" placeholder="https://iina.io" autocomplete="url">
        </label>
        <button id="submit" type="submit">查询 Recipe</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="result">
        <div class="result-head">
          <div><h2 id="result-name"></h2><p id="result-meta"></p></div>
          <span class="badge" id="result-badge"></span>
        </div>
        <pre id="result-json"></pre>
        <a class="download" id="download" href="#">下载 Recipe JSON</a>
      </section>
    </section>
  </main>
  <script>
    const form = document.querySelector('#recipe-form');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(form));
      status.className = '';
      status.textContent = '正在查询现有 Recipe…';
      result.classList.remove('visible');
      submit.disabled = true;
      try {
        const query = new URLSearchParams(payload);
        let response = await fetch(`/api/recipes/search?${query}`);
        let data = await response.json();
        if (!response.ok) throw new Error(data.error || '查询失败');
        if (!data.found) {
          status.textContent = '未找到现有 Recipe，正在调用内部流程抓取并生成。通常需要几分钟，请不要关闭页面…';
          response = await fetch('/api/recipes/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          data = await response.json();
          if (!response.ok) throw new Error(data.error || '生成失败');
        }
        showResult(data);
      } catch (error) {
        status.className = 'error';
        status.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });

    function showResult(data) {
      status.textContent = data.generated ? 'Recipe 已生成、校验并保存。' : '已找到现有 Recipe。';
      document.querySelector('#result-name').textContent = data.summary.name;
      document.querySelector('#result-meta').textContent = [data.summary.bundleId, data.summary.officialHost].filter(Boolean).join(' · ') || data.summary.id;
      document.querySelector('#result-badge').textContent = data.generated ? '新生成' : (data.summary.source === 'generated' ? '用户 Recipe' : '内置 Recipe');
      document.querySelector('#result-json').textContent = JSON.stringify(data.recipe, null, 2);
      document.querySelector('#download').href = data.downloadURL;
      result.classList.add('visible');
    }
  </script>
</body>
</html>
